<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Screening Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AC</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">The Screening Room</a>
      <span id="nav-user"></span>
    </div>
  </header>

  <main class="auth-main">
    <a class="back-link" href="index.html">&larr; Back to search</a>

    <section class="card auth-card">
      <h1>Log in</h1>
      <form id="login-form">
        <div class="form-row">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="form-error"></p>
        <div class="form-row">
          <button type="submit" class="btn">Log in</button>
        </div>
      </form>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up here</a>.</p>
    </section>
  </main>

  <script src="escapeHtml.js"></script>
  <script src="nav.js"></script>
  <script src="login.js"></script>
</body>
</html>
