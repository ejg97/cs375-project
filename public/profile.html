<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - The Screening Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AC</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">🎬 The Screening Room</a>
      <p class="tagline">Search, rate, and review anything TMDB knows about</p>
      <span id="nav-user"></span>
    </div>
  </header>

  <main>
    <a class="back-link" href="index.html">&larr; Back to search</a>

    <div id="profile">
      <h1 id="profile-username"></h1>
      <p id="profile-joined"></p>
      <div id="friend-action"></div>
    </div>

    <section id="friend-requests-section" hidden>
      <h2>Friend requests</h2>
      <div id="friend-requests"></div>
    </section>

    <section id="friends-section">
      <h2>Friends</h2>
      <div id="friends-list"></div>
    </section>

    <section id="profile-reviews-section">
      <h2>Reviews</h2>
      <div id="profile-reviews"></div>
    </section>
  </main>

  <script src="escapeHtml.js"></script>
  <script src="nav.js"></script>
  <script src="profile.js"></script>
</body>
</html>
