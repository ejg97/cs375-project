<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - The Screening Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AC</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">🎬 The Screening Room</a>
      <span id="nav-user"></span>
    </div>
  </header>

  <main class="auth-main">
    <a class="back-link" href="index.html">&larr; Back to search</a>

    <section class="card auth-card">
      <h1>Create an account</h1>
      <form id="signup-form">
        <div class="form-row">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" autocomplete="username" required>
        </div>
        <div class="form-row">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-row">
          <label for="signup-confirm-password">Confirm password</label>
          <input type="password" id="signup-confirm-password" autocomplete="new-password" required minlength="8">
        </div>
        <p id="signup-error" class="form-error"></p>
        <div class="form-row">
          <button type="submit" class="btn">Create account</button>
        </div>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in here</a>.</p>
    </section>
  </main>

  <script src="escapeHtml.js"></script>
  <script src="nav.js"></script>
  <script src="signup.js"></script>
</body>
</html>
